name: CI

on:
  push :
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
    branches:
      - main

# One run per branch: a rapid series of pushes should not queue duplicate jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The whole repo is black-clean, so there is no need to work out which files the pull
      # request touched. That is what Ana06/get-changed-files used to do, at the cost of a
      # third-party action running on every pull request and seven deprecated `set-output`
      # warnings per run.
      - name: check black
        run: |
          pip install black==22.3.0
          bash ./scripts/black.sh

  lint-flake-8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Lint with flake8
        run: |
          pip install flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude .git,__pycache__,docs/source/conf.py,old,build,dist,tests/
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude .git,__pycache__,docs/source/conf.py,old,build,dist,tests/

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the proxy runs on 3.11.6 in production; test what we ship on
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest psutil
          python -m pip install .
#          python -m pip install codecov pytest-cov
      - name: Run tests
        run: |
          pytest -v -s
