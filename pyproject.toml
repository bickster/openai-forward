[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai_forward"
description = "🚀 OpenAI API Reverse Proxy · ChatGPT API Proxy"
authors = [
    { name = "kunyuan", email = "beidongjiedeguang@gmail.com" },
]
license = "MIT"
requires-python = ">=3.6"
readme = "README.md"
keywords = ["openai", "chatgpt", "openai-api", "openai-proxy", "OpenAI API Forwarding", "streaming-api", "fastapi", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3"
]

dependencies = [
    "loguru",
    # Upper bound deliberately: sparrow-python grew heavy undeclared imports at package
    # import time -- 0.5.x needs pandas, 0.6.x needs cv2, neither of which it declares. With
    # an open range a fresh `pip install .` resolves to 0.6.2 and cannot import at all.
    "sparrow-python>=0.1.3,<0.5",
    "fastapi",
    "uvicorn",
    "orjson",
    "python-dotenv",
    "httpx",
    "pytz",
    # sparrow-python imports numpy at package import without declaring it, so `pip install .`
    # produced an install that could not import openai_forward at all.
    "numpy",
    # starlette needs this for request.form(); without it the image-edit path raises inside
    # the broad except in to_openai and silently forwards the body unrewritten.
    "python-multipart",
]

dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/beidongjiedeguang/openai-forward"
Documentation = "https://github.com/beidongjiedeguang/openai-forward#openai-forward"
Issues = "https://github.com/beidongjiedeguang/openai-forward/issues"
Source = "https://github.com/beidongjiedeguang/openai-forward"

[project.optional-dependencies]
tool = [
    "orjsonl"
]

[project.scripts]
openai_forward = "openai_forward.__main__:main"
openai-forward = "openai_forward.__main__:main"
aifwd = "openai_forward.__main__:main"

[tool.hatch.version]
path = "openai_forward/__init__.py"

[tool.isort]
profile = "black"

[tool.hatch.build]
include = [
    "openai_forward/**/*.py",
]
exclude = [
]

artifacts = [
    "openai_forward/web/index.js",
]


[tool.hatch.build.targets.wheel]
packages = ["openai_forward"]